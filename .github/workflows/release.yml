name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/wolfetch-${GITHUB_REF_NAME}-${{ matrix.target == 'x86_64-unknown-linux-gnu' && 'linux-x86_64-gnu' || 'linux-x86_64-musl' }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" wolfetch wfetch
      - uses: actions/upload-artifact@v4
        with:
          name: wolfetch-${{ matrix.target }}
          path: dist/*

  publish:
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: wolfetch ${{ github.ref_name }}
          prerelease: true
          files: dist/*
